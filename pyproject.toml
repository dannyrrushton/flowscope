[project]
name = "flowscope"
version = "0.1.0"
description = "Live data-flow monitor for every I/O channel (GTK4)"
requires-python = ">=3.10"
dependencies = ["PyGObject"]

[project.scripts]
flowscope = "flowscope.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
